name: ${COMPOSE_PROJECT_NAME:-linebot-document}

services:
  database:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: linebot_document
      POSTGRES_USER: linebot
      POSTGRES_PASSWORD_FILE: /run/secrets/DATABASE_PASSWORD
    secrets:
      - DATABASE_PASSWORD
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linebot -d linebot_document"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/OBJECT_STORAGE_ACCESS_KEY
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/OBJECT_STORAGE_SECRET_KEY
    secrets:
      - OBJECT_STORAGE_ACCESS_KEY
      - OBJECT_STORAGE_SECRET_KEY
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    secrets:
      - OBJECT_STORAGE_ACCESS_KEY
      - OBJECT_STORAGE_SECRET_KEY
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://object-storage:9000
        "$$(cat /run/secrets/OBJECT_STORAGE_ACCESS_KEY)"
        "$$(cat /run/secrets/OBJECT_STORAGE_SECRET_KEY)";
        mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-linebot-document};
        mc version enable local/${OBJECT_STORAGE_BUCKET:-linebot-document}
    restart: "no"

  app:
    image: ${APP_IMAGE:-linebot-document:local}
    build:
      context: .
    environment:
      COMPANY_ID: ${COMPANY_ID:-company-local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DATABASE_URL: jdbc:postgresql://database:5432/linebot_document
      DATABASE_USERNAME: linebot
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-linebot-document}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      SYSTEM_ROOT_PATH: /tmp/linebot
      LOCAL_ADMIN_CONTAINER_HOST_ACCESS: "true"
      ADMIN_LOCAL_ONLY: "true"
      ADMIN_TOKEN_REQUIRED: "true"
      LEGACY_SQLITE_ENABLED: "false"
      LEGACY_FILESYSTEM_ENABLED: "false"
      ASSETS_SYNC_ENABLED: "false"
      ASSET_ARCHIVE_CODE_FORMATS: ${ASSET_ARCHIVE_CODE_FORMATS:-ZD#####,ZD#####@,ZD-JY#####,YJ######}
    secrets:
      - DATABASE_PASSWORD
      - OBJECT_STORAGE_ACCESS_KEY
      - OBJECT_STORAGE_SECRET_KEY
      - LINE_BOT_CHANNEL_TOKEN
      - LINE_BOT_CHANNEL_SECRET
      - ADMIN_TOKEN
      - ASSETS_SYNC_TOKEN
    depends_on:
      database:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8089}:8089"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8089/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10
    stop_grace_period: 40s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.8.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--protocol", "${CLOUDFLARED_PROTOCOL:-http2}", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/CLOUDFLARED_TOKEN
    secrets:
      - CLOUDFLARED_TOKEN
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  DATABASE_PASSWORD:
    file: ${SECRETS_DIR:-./secrets}/database-password
  OBJECT_STORAGE_ACCESS_KEY:
    file: ${SECRETS_DIR:-./secrets}/object-storage-access-key
  OBJECT_STORAGE_SECRET_KEY:
    file: ${SECRETS_DIR:-./secrets}/object-storage-secret-key
  LINE_BOT_CHANNEL_TOKEN:
    file: ${SECRETS_DIR:-./secrets}/line-channel-token
  LINE_BOT_CHANNEL_SECRET:
    file: ${SECRETS_DIR:-./secrets}/line-channel-secret
  ADMIN_TOKEN:
    file: ${SECRETS_DIR:-./secrets}/admin-token
  ASSETS_SYNC_TOKEN:
    file: ${SECRETS_DIR:-./secrets}/assets-sync-token
  CLOUDFLARED_TOKEN:
    file: ${SECRETS_DIR:-./secrets}/cloudflared-token

volumes:
  database-data:
  object-storage-data:
