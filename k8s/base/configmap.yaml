apiVersion: v1
kind: ConfigMap
metadata:
  name: linebot-document-config
data:
  COMPANY_ID: company-id
  PUBLIC_BASE_URL: https://document.example.com
  DATABASE_URL: jdbc:postgresql://postgres.example.internal:5432/linebot_document
  DATABASE_USERNAME: linebot
  OBJECT_STORAGE_ENDPOINT: ""
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: linebot-document
  OBJECT_STORAGE_FORCE_PATH_STYLE: "false"
  SYSTEM_ROOT_PATH: /tmp/linebot
  LEGACY_SQLITE_ENABLED: "false"
  LEGACY_FILESYSTEM_ENABLED: "false"
  ADMIN_TOKEN_REQUIRED: "true"
  ADMIN_LOCAL_ONLY: "false"
  ASSETS_SYNC_ENABLED: "false"
