spring.application.name=linebot-document
spring.main.log-startup-info=false

# LINE Bot 自身的埠號
server.port=8088

# Docker Desktop 會將本機埠轉接顯示為私有橋接來源；僅在主機埠綁定 loopback 時啟用。
app.admin.container-host-access-enabled=${LOCAL_ADMIN_CONTAINER_HOST_ACCESS:false}

# ===== LINE 憑證（由 .env / 容器環境變數帶入，不寫進版控）=====
line.bot.channel-token=${LINE_BOT_CHANNEL_TOKEN:}
line.bot.channel-secret=${LINE_BOT_CHANNEL_SECRET:}
app.line.connect-timeout-seconds=${LINE_CONNECT_TIMEOUT_SECONDS:10}
app.line.request-timeout-seconds=${LINE_REQUEST_TIMEOUT_SECONDS:30}

# ===== 系統共同根目錄 =====
# 所有持久檔案都由這個根目錄推導，不再分別接受資產與日誌路徑。
app.system.root=${SYSTEM_ROOT_PATH:${user.dir}/system-data}
app.storage.root=${app.system.root}/\u5716\u7247\u8CC7\u7522

# 內建排程預設停用，改由 scripts/sync-assets.ps1 在後台觸發。
app.storage.sync-enabled=${ASSETS_SYNC_ENABLED:false}
app.storage.sync-interval-ms=${ASSETS_SYNC_INTERVAL_MS:30000}
app.storage.sync-token=${ASSETS_SYNC_TOKEN:}

# LINE 伺服器抓圖用的對外 HTTPS 網址（結尾不要帶斜線）
# 測試階段填 ngrok 網址，部署階段填公司伺服器的網域
app.public-base-url=${PUBLIC_BASE_URL:}

# 單次查詢最多回傳幾張圖（LINE reply 一次上限 5 則訊息，保留 1 則給文字摘要）
app.query.max-results=${QUERY_MAX_RESULTS:4}

# 客戶資料夾代碼格式；# 代表數字、@ 代表大寫英文字母。
app.archive.code-formats=${ASSET_ARCHIVE_CODE_FORMATS:ZD#####,ZD#####@,ZD-JY#####,YJ######}

# ===== SQLite 資產索引 =====
# DataSource 由 StorageConfig 手動建立（需要先確保 storage 目錄存在），
# 連線池與 PRAGMA 設定也一併在那裡，不走 spring.datasource.hikari.* 。
spring.datasource.url=jdbc:sqlite:${app.storage.root}/assets.db
spring.sql.init.mode=always

# ===== 健康檢查 =====
# Dockerfile 的 HEALTHCHECK 會打這個端點
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ===== 流程追蹤 =====
# 啟用後會記錄所有 Spring 管理的公開方法：進入、完成時間與例外類型。
# 不記錄方法參數與回傳內容，避免 token、訊息內容或圖片資料進入 log。
app.observability.method-tracing-enabled=${METHOD_TRACING_ENABLED:false}
app.observability.log-path=${app.system.root}/log
app.observability.resource-interval-ms=${RESOURCE_LOG_INTERVAL_MS:60000}
